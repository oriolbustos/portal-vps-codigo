<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas</title>
<link rel="stylesheet" href="/estatico/estilo.css">
<link rel="icon" href="/estatico/iconos/fav-tareas.svg" type="image/svg+xml">
<style>
.filtros { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; padding: 24px 0 16px; }
.filtros > div { display: flex; flex-direction: column; gap: 6px; }
.filtros > div[hidden] { display: none; }
.segmentos { flex-wrap: wrap; }

/* añadir */
.anadir { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 24px; border: 1px solid var(--linea); background: var(--fondo-alto); }
.anadir input, .anadir select { font: inherit; font-size: 16px; color: var(--tinta-alta); background: transparent; border: 0; padding: 10px 12px; min-width: 0; }
.anadir input { flex: 1 1 260px; }
.anadir input:focus, .anadir select:focus { outline: none; }
.anadir:focus-within { border-color: var(--linea-alta); }
.anadir select { border-left: 1px solid var(--linea); cursor: pointer; }
.anadir select.pt { padding: 10px 8px; font-family: var(--mono); font-weight: 300; font-size: 14px; color: var(--tinta-2); }
.anadir select.pt.puesto { color: var(--tinta-alta); }
/* la lista que abre el desplegable la pinta el sistema: sin esto, en modo oscuro sale texto claro sobre blanco */
.anadir select option { background: var(--fondo-alto); color: var(--tinta-alta); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .anadir select { color-scheme: dark; } }
:root[data-theme="dark"] .anadir select { color-scheme: dark; }
.anadir .boton { margin: 6px; }
@media (max-width: 600px) { .anadir select { flex: 1 1 auto; } }

/* gráfico */
.grafico { padding: 16px; }
@media (min-width: 768px) { .grafico { padding: 20px 24px; } }
.grafico .que { color: var(--tinta-2); font-size: var(--t-xs); margin: 4px 0 16px; }
.cabeza-graf { display: flex; flex-direction: column; gap: 12px; }
/* vista y ejes, plegados tras un enlace discreto junto al título */
.titulo-graf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.editar-graf { font: inherit; font-size: var(--t-xs); color: var(--tinta-2); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--linea); }
.editar-graf:hover { color: var(--tinta-alta); }
.mandos { display: flex; flex-wrap: wrap; gap: 12px 24px; }
.mandos[hidden] { display: none; }
.mandos > div { display: flex; flex-direction: column; gap: 6px; }
.mandos > div[hidden] { display: none; }
.plano { display: grid; grid-template-columns: 18px 22px repeat(6, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(56px, auto)) auto auto auto; }
.plano .cuad-et { grid-row: 1; padding-bottom: 6px; }
.plano .cuad-et.abajo { grid-row: 9; padding: 6px 0 0; }
.plano .celda { border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); padding: 4px; display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 3px; min-width: 0; }
.plano .celda.izq { border-left: 1px solid var(--linea); }
.plano .celda.arr { border-top: 1px solid var(--linea); }
.plano .celda.mitad-x { border-right-color: var(--tinta-2); }
.plano .celda.mitad-y { border-bottom-color: var(--tinta-2); }
.plano .eje-y { grid-column: 2; font-family: var(--mono); font-weight: 300; font-size: var(--t-xs); color: var(--tinta-2); display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.plano .eje-x { grid-row: 8; font-family: var(--mono); font-weight: 300; font-size: var(--t-xs); color: var(--tinta-2); text-align: center; padding-top: 4px; }
.plano .nombre-x { grid-row: 10; grid-column: 3 / 9; text-align: center; padding-top: 2px; }
.plano .nombre-y { grid-row: 2 / 8; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; justify-self: start; }
/* 1D: una columna de 5 (arriba) a 0, con las tareas de cada valor en su fila */
.plano.uno { grid-template-columns: 22px minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: minmax(48px, auto); }
.plano.uno .nombre-uno { grid-column: 1 / 3; padding-bottom: 6px; min-height: 0; }
.plano.uno .eje-y { grid-column: 1; }
.plano.uno .celda { grid-column: 2; border-left: 1px solid var(--linea); }
.punto-t { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; font: inherit; font-size: var(--t-xs); line-height: 1.2; padding: 2px 5px 2px 4px; border: 1px dotted var(--tinta-2); border-radius: 4px;
  background: var(--fondo-alto); color: var(--tinta); cursor: grab; text-align: left;
  /* el arrastre con el dedo empieza con pulsación larga: sin menú ni selección de texto del sistema */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
/* una marca por tarea: el color dice el ámbito y la forma el estado.
   To Do = anillo hueco (pendiente), Doing = círculo relleno, Monitoring = triángulo.
   Ámbitos, en el orden de Panel.md y sin rojo (en el portal marca "aquí" o un aviso): azul, verde azulado y ocre
   del portal (c1, c3, c4) más morado, marrón y oliva */
:root { --a1: var(--c1); --a2: var(--c3); --a3: var(--c4); --a4: #7a5ea8; --a5: #8a5a3c; --a6: #6f7f22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --a4: #9a80cc; --a5: #b98563; --a6: #9aab45; } }
:root[data-theme="dark"] { --a4: #9a80cc; --a5: #b98563; --a6: #9aab45; }
.mks { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk { --k: var(--tinta-alta); display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.mk.todo { width: 9px; height: 9px; background: transparent; box-shadow: inset 0 0 0 2px var(--k); }
.mk.seguimiento { width: 10px; height: 9px; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
/* tamaño = tercera puntuación (2D): --s va de 6 px (0) a 16 px (5); sin puntuar, pequeña y tenue */
.mk.tam { width: var(--s); height: var(--s); }
.mk.tam.seguimiento { width: calc(var(--s) + 2px); }
.mk.tam.sin { opacity: 0.45; }
.mks.tam { min-width: 16px; min-height: 16px; }
.t-texto .mks { margin-right: 8px; vertical-align: 1px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--t-xs); color: var(--tinta-2); margin: -8px 0 12px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda .grupo { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }
.leyenda .grupo + .grupo { padding-left: 16px; border-left: 1px solid var(--linea); }
.leyenda .grupo > b { font-weight: 500; color: var(--tinta-2); }
.punto-t .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.punto-t:hover { border-style: solid; color: var(--tinta-alta); }
.punto-t.sel { border: 1px solid var(--tinta-alta); box-shadow: 0 0 0 1px var(--tinta-alta); }
/* móvil: la etiqueta ocupa la casilla y el nombre va en dos líneas, recortado */
@media (max-width: 760px) {
  .grafico { padding: 12px 8px; }
  .grafico > .cabeza-graf, .grafico > .que, .grafico > .leyenda, .grafico > .pie-graf { padding: 0 8px; }
  .plano { grid-template-columns: 12px 16px repeat(6, minmax(0, 1fr)); }
  .plano .eje-y { padding-right: 4px; }
  .plano .celda { padding: 2px; gap: 2px; }
  .punto-t { width: 100%; align-items: flex-start; font-size: 10.5px; line-height: 1.15; padding: 2px; gap: 2px; border-radius: 3px; }
  .punto-t .mks { margin-top: 1px; }
  .punto-t .txt { white-space: normal; overflow-wrap: anywhere; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .plano.uno .punto-t { width: auto; align-items: center; font-size: var(--t-xs); padding: 3px 5px 3px 4px; }
  .plano.uno .punto-t .txt { white-space: nowrap; display: block; }
  /* nombres de eje cortos en los mandos */
  .mandos .largo { display: none; }
}
@media (min-width: 761px) { .mandos .corto { display: none; } }

/* arrastrar en el gráfico: con el ratón, directamente; con el dedo, tras una pulsación larga */
.pie-graf { margin-top: 10px; font-size: var(--t-xs); color: var(--tinta-2); }
.plano.arrastre .celda { background: var(--fondo-2); }
.plano.arrastre .celda.destino { background: var(--fondo-alto); box-shadow: inset 0 0 0 1px var(--linea-alta); }
.punto-t.arrastrando { opacity: 0.35; }
.punto-t.agarrado { border-style: solid; box-shadow: 0 0 0 1px var(--tinta-alta); }
.fantasma { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -120%); width: auto !important; max-width: 60vw; border-style: solid; box-shadow: 0 0 0 1px var(--tinta-alta); }

/* cuadrantes y listas */
.matriz { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 32px; }
@media (max-width: 760px) { .matriz { grid-template-columns: 1fr; } }
.cuadrante, .grupo-amb { padding: 16px; min-height: 120px; }
@media (min-width: 768px) { .cuadrante, .grupo-amb { padding: 20px 24px; } }
.cuadrante header, .grupo-amb header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.cuadrante h2, .grupo-amb h2 { font-family: var(--serif); font-size: var(--t-2xl); line-height: 1.1; }
.cuadrante .que { color: var(--tinta-2); font-size: var(--t-xs); margin-bottom: 8px; }
.cuenta { font-family: var(--mono); font-size: var(--t-xs); color: var(--tinta-2); }
ul.tareas { list-style: none; margin: 0; padding: 0; }
/* fila: círculo para marcar hecha (como en To Do) + la tarea, que abre el detalle */
ul.tareas > li.fila { display: flex; align-items: flex-start; gap: 10px; border-top: 1px solid var(--linea); }
ul.tareas > li.fila:first-child { border-top: 0; }
ul.tareas .t-abrir { all: unset; box-sizing: border-box; flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; cursor: pointer; }
ul.tareas .t-abrir:hover .t-texto { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--tinta-2); }
ul.tareas .t-abrir:focus-visible { outline: 2px solid var(--linea-alta); outline-offset: 2px; }
/* pequeño (0,66 em) y centrado en la primera línea: 10px de relleno + media línea (1,5 de interlineado) - medio círculo */
.t-check { flex: none; font-size: var(--t-base); width: 0.66em; height: 0.66em; margin-top: calc(10px + 0.75em - 0.33em + 1px); padding: 0; border: 1.25px solid var(--tinta-2); border-radius: 50%; background: none; color: var(--tinta-alta); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.t-check svg { display: block; opacity: 0; }
.t-check:hover { border-color: var(--tinta-alta); }
.t-check:hover svg, .t-check:focus-visible svg { opacity: 0.8; }
.t-check.marcada { background: var(--tinta-alta); border-color: var(--tinta-alta); color: var(--fondo); }
.t-check.marcada svg { opacity: 1; }
/* hechas: al final de cada ámbito en la vista Lista, plegadas como "Completadas" en To Do */
details.hechas { margin-top: 8px; border-top: 1px solid var(--linea); }
details.hechas > summary { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; cursor: pointer; list-style: none; color: var(--tinta-2); }
details.hechas > summary::-webkit-details-marker { display: none; }
details.hechas > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 0.15s; margin: 0 2px; }
details.hechas[open] > summary::before { transform: rotate(45deg); }
details.hechas > summary:hover { color: var(--tinta-alta); }
ul.tareas.hechas-lista .t-fila { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; }
ul.tareas.hechas-lista .t-texto { color: var(--tinta-2); text-decoration: line-through; text-decoration-color: var(--linea); }
ul.tareas > li.sel .t-texto::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--acento); margin-right: 8px; vertical-align: 2px; }
.t-texto { color: var(--tinta-alta); }
.t-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.t-meta .insignia { font-size: var(--t-xs); padding: 2px 5px; }
.t-extra { font-size: var(--t-xs); color: var(--tinta-2); }
.t-pts { font-family: var(--mono); font-weight: 300; font-size: var(--t-xs); color: var(--tinta-2); white-space: pre; text-align: right; }
.vista[hidden] { display: none; }
.pie-panel { margin-top: 32px; font-size: var(--t-xs); color: var(--tinta-2); }

/* detalle, como el de Microsoft To Do: círculo para marcar hecha junto al título y cruz arriba para cerrar */
.velo { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); z-index: 10; }
.velo[hidden], .detalle[hidden] { display: none; }
.detalle { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--fondo); border-left: 1px solid var(--linea); z-index: 11; display: flex; flex-direction: column; }
.d-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--linea); }
.d-x { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; background: none; border: 0; border-radius: 6px; color: var(--tinta-2); cursor: pointer; }
.d-x:hover { color: var(--tinta-alta); background: var(--fondo-2); }
.d-x svg, .d-check svg { display: block; }
.d-cuerpo { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
.d-pie { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--linea); font-size: var(--t-xs); color: var(--tinta-2); }
/* el círculo, centrado en la primera línea del título: mismo tamaño de letra que el título (em) y mismo relleno (8px) */
.d-cabeza { display: flex; align-items: flex-start; gap: 12px; font-size: var(--t-2xl); }
.d-check { flex: none; width: 24px; height: 24px; margin-top: calc(8px + 0.575em - 12px); font-size: inherit; padding: 0; border: 1.5px solid var(--tinta-2); border-radius: 50%; background: none; color: var(--tinta-alta); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.d-check svg { opacity: 0; }
.d-check:hover { border-color: var(--tinta-alta); }
.d-check:hover svg, .d-check:focus-visible svg { opacity: 0.8; }
.d-titulo { flex: 1; min-width: 0; width: 100%; font-family: var(--serif); font-size: var(--t-2xl); line-height: 1.15; color: var(--tinta-alta); background: transparent; border: 0; border-bottom: 1px solid transparent; padding: 8px 0; resize: none; overflow: hidden; }
.d-titulo:focus { outline: none; border-bottom-color: var(--linea-alta); }
.d-bloque { padding: 14px 0; border-top: 1px solid var(--linea); }
.d-cabeza + .d-bloque { margin-top: 8px; }
.d-bloque > .etiqueta { display: flex; justify-content: space-between; margin-bottom: 8px; }
.d-bloque .segmentos button { min-width: 36px; }
.d-cuadrante { font-family: var(--serif); font-size: var(--t-xl); color: var(--tinta-alta); }
.d-subs { list-style: none; margin: 0; padding: 0; }
.d-subs li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--linea); }
.d-subs li::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--tinta-2); }
.d-subs input, .d-nuevo-sub { flex: 1; min-width: 0; font: inherit; font-size: var(--t-sm); color: var(--tinta-alta); background: transparent; border: 0; padding: 8px 0; }
.d-subs input:focus, .d-nuevo-sub:focus { outline: none; }
.d-nuevo-sub { width: 100%; border-bottom: 1px solid var(--linea); }
.d-nuevo-sub:focus { border-bottom-color: var(--linea-alta); }
.d-subs button, .d-eliminar { font: inherit; font-size: var(--t-xs); color: var(--tinta-2); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--linea); }
.d-subs button:hover { color: var(--tinta-alta); }
.d-eliminar { padding: 4px 6px; }
.d-eliminar:hover { color: var(--acento); text-decoration-color: var(--acento); }
.d-notas { width: 100%; min-height: 140px; font: inherit; font-size: var(--t-sm); line-height: 1.5; color: var(--tinta-alta); background: var(--fondo-alto); border: 1px solid var(--linea); padding: 10px 12px; resize: vertical; }
.d-notas:focus { outline: none; border-color: var(--linea-alta); }
.d-estado-guardado { font-family: var(--mono); font-weight: 300; }
.d-acciones { display: flex; align-items: center; gap: 12px; }
.d-acciones .boton { padding: 4px 18px; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--tinta-alta); color: var(--fondo); padding: 8px 14px; font-size: var(--t-sm); display: none; z-index: 20; max-width: calc(100vw - 32px); }
@media (max-width: 600px) { .detalle { border-left: 0; } }
</style>
</head>
<body>
<div class="pagina">
<header class="cabecera">
  <div class="marca"><a class="volver" href="/">← Portal</a><h1><span class="sello"><i class="ico ico-tareas"></i></span>Tareas</h1></div>
  <nav class="nav" id="nav"><a href="#matriz">Matriz</a><a href="#lista">Lista</a></nav>
</header>

<div class="filtros">
  <div><span class="etiqueta">Ámbito</span><div class="segmentos" id="f-ambito"></div></div>
  <div><span class="etiqueta">Estado</span><div class="segmentos" id="f-estado"></div></div>
  <div id="f-prio-caja"><span class="etiqueta">Puntuación</span><div class="segmentos" id="f-prio"></div></div>
</div>

<form class="anadir" id="anadir" autocomplete="off">
  <input id="a-texto" placeholder="Añadir una tarea" maxlength="500" aria-label="Nueva tarea">
  <select id="a-ambito" aria-label="Ámbito"></select>
  <select id="a-estado" aria-label="Estado"><option value="todo">To Do</option><option value="doing">Doing</option><option value="seguimiento">Monitoring</option></select>
  <select class="pt" id="a-imp" aria-label="Importancia"></select>
  <select class="pt" id="a-urg" aria-label="Urgencia"></select>
  <select class="pt" id="a-esf" aria-label="Esfuerzo"></select>
  <button class="boton" type="submit">Añadir</button>
</form>

<section class="vista" id="v-matriz">
  <div class="rejilla"><div class="grafico">
    <div class="cabeza-graf"><div class="titulo-graf"><h2 class="titulo-3">Matriz</h2><button type="button" class="editar-graf" id="g-editar" aria-expanded="false" aria-controls="g-mandos">Editar gráfico</button></div>
      <div class="mandos" id="g-mandos" hidden>
        <div><span class="etiqueta">Vista</span><div class="segmentos" id="g-dim"></div></div>
        <div id="g-x-caja"><span class="etiqueta">Horizontal</span><div class="segmentos" id="g-x"></div></div>
        <div id="g-y-caja"><span class="etiqueta">Vertical</span><div class="segmentos" id="g-y"></div></div>
        <div id="g-tam-caja"><span class="etiqueta">Tamaño</span><div class="segmentos" id="g-tam"></div></div>
        <div id="g-uno-caja"><span class="etiqueta">Eje</span><div class="segmentos" id="g-uno"></div></div>
      </div></div>
    <p class="que" id="g-que"></p>
    <div class="leyenda" id="leyenda"></div>
    <div class="plano" id="plano"></div>
    <p class="pie-graf" id="g-pie"></p>
  </div></div>
  <div class="rejilla matriz" id="matriz"></div>
  <div class="rejilla"><div class="cuadrante" id="sin"></div></div>
</section>

<section class="vista" id="v-lista" hidden>
  <div class="rejilla" id="lista"></div>
</section>

<p class="pie-panel" id="pie"></p>
</div>

<div class="velo" id="velo" hidden></div>
<aside class="detalle" id="detalle" hidden aria-label="Detalle de la tarea">
  <div class="d-cab"><span class="etiqueta" id="d-donde"></span>
    <button class="d-x" id="d-cerrar" type="button" aria-label="Cerrar" title="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="d-cuerpo">
    <div class="d-cabeza">
      <button class="d-check" id="d-hecha" type="button" aria-label="Marcar hecha" title="Marcar hecha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <textarea class="d-titulo" id="d-titulo" rows="1" maxlength="500" aria-label="Tarea"></textarea>
    </div>
    <div class="d-bloque"><div class="etiqueta"><span>Importancia</span></div><div class="segmentos" id="d-imp"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Urgencia</span></div><div class="segmentos" id="d-urg"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Esfuerzo</span></div><div class="segmentos" id="d-esf"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Cuadrante</span></div><div class="d-cuadrante" id="d-cuad"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Estado</span></div><div class="segmentos" id="d-estado"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Ámbito</span></div><div class="segmentos" id="d-ambito"></div></div>
    <div class="d-bloque"><div class="etiqueta"><span>Subtareas</span></div><ul class="d-subs" id="d-subs"></ul>
      <input class="d-nuevo-sub" id="d-nuevo-sub" placeholder="Añadir subtarea" maxlength="500"></div>
    <div class="d-bloque"><div class="etiqueta"><span>Notas</span></div><textarea class="d-notas" id="d-notas" placeholder="Detalles, enlaces, lo que haga falta"></textarea></div>
  </div>
  <div class="d-pie"><span class="d-estado-guardado" id="d-guardado"></span><span class="d-acciones"><button class="d-eliminar" id="d-borrar" type="button">Eliminar</button></span></div>
</aside>
<div class="toast" id="toast"></div>
<script id="datos" type="application/json">/*__DATOS__*/null</script>
<script>
"use strict";
let D = JSON.parse(document.getElementById("datos").textContent);
const EST = { doing: "Doing", todo: "To Do", seguimiento: "Monitoring" };
const EJES = { imp: "Importancia", urg: "Urgencia", esf: "Esfuerzo" };
const CORTO = { imp: "I", urg: "U", esf: "E" };
const ALTO = 3;
const CUAD = [
  { id: "hacer", t: "Hacer ya", q: "Urgente e importante", f: x => x.urg >= ALTO && x.imp >= ALTO },
  { id: "planificar", t: "Planificar", q: "Importante, no urgente", f: x => x.urg < ALTO && x.imp >= ALTO },
  { id: "rapido", t: "Resolver rápido", q: "Urgente, no importante", f: x => x.urg >= ALTO && x.imp < ALTO },
  { id: "despues", t: "Más adelante", q: "Ni urgente ni importante", f: x => x.urg < ALTO && x.imp < ALTO },
];
const PRIO = { todas: "Todas", puntuadas: "Puntuadas", sin: "Sin puntuar" };
// ambitos / estados: los elegidos (vacío = todos)
const F = { ambitos: [], estados: [], prio: "todas" };
try { Object.assign(F, JSON.parse(localStorage.getItem("tareas.filtros") || "{}")); } catch (e) {}
if (!Array.isArray(F.ambitos)) F.ambitos = [];
if (!Array.isArray(F.estados)) F.estados = [];
F.ambitos = F.ambitos.filter(a => D.ambitos.includes(a)); F.estados = F.estados.filter(e => EST[e]);
delete F.ambito; delete F.estado; delete F.color; delete F.colores;  // filtros de antes
if (!PRIO[F.prio]) F.prio = "todas";
// gráfico: 1D (un eje) o 2D (dos ejes, y la tercera puntuación como tamaño si se pide)
const G = { dim: 2, x: "urg", y: "imp", uno: "imp", tam: false };
try { Object.assign(G, JSON.parse(localStorage.getItem("tareas.grafico") || "{}")); } catch (e) {}
if (G.dim !== 1 && G.dim !== 2) G.dim = 2;
if (!EJES[G.x] || !EJES[G.y] || G.x === G.y) { G.x = "urg"; G.y = "imp"; }
if (!EJES[G.uno]) G.uno = "imp";
G.tam = G.tam === true;
let sel = null;          // id de la tarea abierta
let arrastre = null, movido = false;
let pendientes = 0;
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, txt) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };
const puntuada = x => x.imp != null && x.urg != null;
const cuadrante = x => puntuada(x) ? CUAD.find(c => c.f(x)) : null;
const peso = x => (x.imp ?? -1) * 10 + (x.urg ?? -1);
const tarea = id => D.tareas.find(x => x.id === id);
const tercero = () => Object.keys(EJES).find(k => k !== G.x && k !== G.y);
const eisenhower = () => G.dim === 2 && [G.x, G.y].sort().join() === "imp,urg";

function segmentos(c, opciones, actual, fn) {
  c.replaceChildren();
  for (const [v, t] of opciones) {
    const b = el("button", { type: "button", ...(v === actual ? { class: "on" } : {}) });
    b.append(t);
    b.onclick = () => fn(v);
    c.append(b);
  }
}
const filtro = (clave, v) => { F[clave] = v; try { localStorage.setItem("tareas.filtros", JSON.stringify(F)); } catch (e) {} pintar(); };
function grafico(cambios) {
  // elegir en un eje el que ya está en el otro los intercambia
  if (cambios.x && cambios.x === G.y) cambios.y = G.x;
  if (cambios.y && cambios.y === G.x) cambios.x = G.y;
  Object.assign(G, cambios);
  try { localStorage.setItem("tareas.grafico", JSON.stringify(G)); } catch (e) {}
  pintar();
}
// "Todos" vacía la selección; cada opción se añade o se quita (se pueden elegir varias)
function multiple(c, opciones, clave) {
  c.replaceChildren();
  const elegidos = F[clave];
  const todos = el("button", { type: "button", ...(elegidos.length ? {} : { class: "on" }) }, "Todos");
  todos.onclick = () => filtro(clave, []);
  c.append(todos);
  for (const [v, t] of opciones) {
    const on = elegidos.includes(v);
    const b = el("button", { type: "button", "aria-pressed": String(on), ...(on ? { class: "on" } : {}) }, t);
    b.onclick = () => { const n = on ? elegidos.filter(x => x !== v) : [...elegidos, v]; filtro(clave, n.length === opciones.length ? [] : n); };
    c.append(b);
  }
}
const unAmbito = () => F.ambitos.length === 1;

// marca de una tarea, siempre igual: color = ámbito (en el orden de Panel.md), forma = estado
const colAmbito = a => `var(--a${D.ambitos.indexOf(a) % 6 + 1})`;
function marca(ambito, estado, titulo, tam) {
  const i = el("i", { class: "mk" + (estado ? " " + estado : ""), title: titulo || "" });
  if (ambito) i.style.setProperty("--k", colAmbito(ambito));
  if (tam !== undefined) { i.classList.add("tam"); if (tam == null) i.classList.add("sin"); i.style.setProperty("--s", (tam == null ? 5 : 6 + 2 * tam) + "px"); }
  return i;
}
function marcas(x, tam) {
  const m = el("span", { class: "mks" + (tam ? " tam" : "") });
  m.append(marca(x.ambito, x.estado, `${x.ambito}, ${EST[x.estado]}`, tam ? x[tam] : undefined));
  return m;
}
function leyenda() {
  const l = $("leyenda"); l.replaceChildren();
  const grupo = (titulo, items) => { const g = el("span", { class: "grupo" }); g.append(el("b", {}, titulo)); for (const [t, m] of items) { const s = el("span"); s.append(...m, t); g.append(s); } l.append(g); };
  grupo("Color", D.ambitos.filter(a => !F.ambitos.length || F.ambitos.includes(a)).map(a => [a, [marca(a, "", a)]]));
  grupo("Forma", Object.entries(EST).filter(([k]) => !F.estados.length || F.estados.includes(k)).map(([k, t]) => [t, [marca("", k, t)]]));
  if ($("v-matriz").hidden || G.dim !== 2 || !G.tam) return;
  const z = tercero();
  grupo("Tamaño", [[`${EJES[z]} 0 a 5`, [marca("", "doing", "0", 0), marca("", "doing", "5", 5)]]]);
}

function filtradas(conPrio) {
  return D.tareas.filter(x => (!F.ambitos.length || F.ambitos.includes(x.ambito)) && (!F.estados.length || F.estados.includes(x.estado)) &&
    (!conPrio || F.prio === "todas" || (F.prio === "puntuadas" && puntuada(x)) || (F.prio === "sin" && !puntuada(x))));
}

const CHECK = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function item(x, conAmbito = true) {
  const li = el("li", { class: "fila" + (x.id === sel ? " sel" : "") }), b = el("button", { type: "button", class: "t-abrir" }), izq = el("div");
  const tx = el("div", { class: "t-texto" });
  tx.append(marcas(x), x.texto); izq.append(tx);
  const meta = el("div", { class: "t-meta" });
  if (conAmbito) meta.append(el("span", { class: "insignia" }, x.ambito));
  meta.append(el("span", { class: "insignia" }, EST[x.estado]));
  const extra = [];
  if (x.sub.length) extra.push(x.sub.length === 1 ? "1 subtarea" : `${x.sub.length} subtareas`);
  if (x.notas.length) extra.push("nota");
  if (extra.length) meta.append(el("span", { class: "t-extra" }, extra.join(", ")));
  izq.append(meta);
  b.append(izq, el("span", { class: "t-pts", title: "Importancia, urgencia, esfuerzo" }, `I ${x.imp ?? "-"}  U ${x.urg ?? "-"}  E ${x.esf ?? "-"}`));
  b.onclick = () => abrir(x.id);
  const ok = el("button", { type: "button", class: "t-check", "aria-label": `Marcar hecha: ${x.texto}`, title: "Marcar hecha" });
  ok.innerHTML = CHECK;
  ok.onclick = () => {
    ok.classList.add("marcada"); ok.disabled = true;  // se ve ya; al guardarse, la tarea pasa a Done y sale de la lista
    operar({ op: "completar", ambito: x.ambito, base: D.bases[x.ambito], id: x.id }, `Hecha. Movida a Done de ${x.ambito}`);
  };
  li.append(ok, b);
  return li;
}

function lista(ul, xs, conAmbito) {
  if (!xs.length) { ul.append(el("li", { class: "vacio", style: "padding:12px 0;text-align:left" }, "Nada aquí")); return; }
  const orden = { doing: 0, todo: 1, seguimiento: 2 };
  for (const x of xs.slice().sort((a, b) => peso(b) - peso(a) || orden[a.estado] - orden[b.estado])) ul.append(item(x, conAmbito));
}

// etiqueta de una tarea en el gráfico; pts = las puntuaciones que fija su casilla (las que cambia al arrastrarla)
function chip(x, tam) {
  const b = el("button", { type: "button", class: "punto-t" + (x.id === sel ? " sel" : ""),
    title: `${x.texto} (${x.ambito}, I ${x.imp ?? "-"} U ${x.urg ?? "-"} E ${x.esf ?? "-"})` });
  b.dataset.id = x.id; b.append(marcas(x, tam), el("span", { class: "txt" }, x.texto));
  b.onclick = () => { if (!movido) abrir(x.id); };
  return b;
}
const porTexto = (a, b) => a.texto.localeCompare(b.texto);

function plano2(xs) {
  const X = G.x, Y = G.y, Z = G.tam ? tercero() : null, p = $("plano");
  p.className = "plano"; p.replaceChildren();
  const et = (txt, col, abajo) => p.append(el("span", { class: "etiqueta cuad-et" + (abajo ? " abajo" : ""), style: `grid-column:${col}` }, txt));
  // nombres de cuadrante solo con urgencia × importancia (en cualquier orden)
  const nombre = (altoX, altoY) => CUAD.find(c => c.f({ [X]: altoX ? ALTO : 0, [Y]: altoY ? ALTO : 0 })).t;
  if (eisenhower()) { et(nombre(false, true), "3 / 6"); et(nombre(true, true), "6 / 9"); }
  for (let vy = 5; vy >= 0; vy--) {
    const fila = 7 - vy;
    p.append(el("span", { class: "eje-y", style: `grid-row:${fila}` }, String(vy)));
    for (let vx = 0; vx <= 5; vx++) {
      const cls = ["celda"]; if (vx === 0) cls.push("izq"); if (vy === 5) cls.push("arr");
      if (vx === ALTO - 1) cls.push("mitad-x"); if (vy === ALTO) cls.push("mitad-y");
      const c = el("div", { class: cls.join(" "), style: `grid-row:${fila};grid-column:${vx + 3}` });
      c.pts = { [X]: vx, [Y]: vy };
      for (const x of xs.filter(x => x[X] === vx && x[Y] === vy).sort(porTexto)) c.append(chip(x, Z));
      p.append(c);
    }
  }
  for (let vx = 0; vx <= 5; vx++) p.append(el("span", { class: "eje-x", style: `grid-column:${vx + 3}` }, String(vx)));
  if (eisenhower()) { et(nombre(false, false), "3 / 6", true); et(nombre(true, false), "6 / 9", true); }
  p.append(el("span", { class: "etiqueta nombre-x" }, EJES[X]), el("span", { class: "etiqueta nombre-y" }, EJES[Y]));
}

function plano1(xs) {
  const E = G.uno, p = $("plano");
  p.className = "plano uno"; p.replaceChildren(el("span", { class: "etiqueta nombre-uno" }, EJES[E]));
  for (let v = 5; v >= 0; v--) {
    p.append(el("span", { class: "eje-y" }, String(v)));
    const c = el("div", { class: "celda" + (v === 5 ? " arr" : "") + (v === ALTO ? " mitad-y" : "") });
    c.pts = { [E]: v };
    for (const x of xs.filter(x => x[E] === v).sort((a, b) => peso(b) - peso(a) || porTexto(a, b))) c.append(chip(x));
    p.append(c);
  }
}

function matriz() {
  const xs = filtradas(false);
  const ejes = G.dim === 2 ? [G.x, G.y] : [G.uno];
  const dentro = xs.filter(x => ejes.every(k => x[k] != null));
  G.dim === 2 ? plano2(dentro) : plano1(dentro);
  const fuera = xs.length - dentro.length;
  const nombres = ejes.map(k => EJES[k].toLowerCase());
  $("g-que").textContent = (G.dim === 2
    ? `Cada tarea según su ${nombres[0]} (horizontal) y ${nombres[1]} (vertical), de 0 a 5.`
    : `Cada tarea según su ${nombres[0]}, de 0 a 5.`) +
    " Arrastra una tarea a otra casilla para cambiar su puntuación (con el dedo, mantenla pulsada un momento). Tócala para abrirla.";
  $("g-pie").textContent = fuera ? `${fuera === 1 ? "1 tarea" : fuera + " tareas"} sin ${nombres.join(" o ")} no ${fuera === 1 ? "sale" : "salen"} en el gráfico.` : "";
  const m = $("matriz"); m.replaceChildren();
  for (const c of CUAD) {
    const caja = el("div", { class: "cuadrante" }), h = el("header"), s = xs.filter(x => puntuada(x) && c.f(x));
    h.append(el("h2", {}, c.t), el("span", { class: "cuenta" }, String(s.length)));
    caja.append(h, el("p", { class: "que" }, c.q));
    const ul = el("ul", { class: "tareas" }); lista(ul, s, !unAmbito()); caja.append(ul); m.append(caja);
  }
  const sin = xs.filter(x => !puntuada(x)), s = $("sin"); s.replaceChildren();
  const h = el("header"); h.append(el("h2", {}, "Sin puntuar"), el("span", { class: "cuenta" }, String(sin.length)));
  s.append(h, el("p", { class: "que" }, "Ábrela y ponle importancia y urgencia para colocarla en los cuadrantes."));
  const ul = el("ul", { class: "tareas" }); lista(ul, sin, !unAmbito()); s.append(ul);
}

// en el móvil, "Imp.", "Urg.", "Esf." para que cada eje quepa en una línea
const nombreEje = k => { const f = document.createDocumentFragment(); f.append(el("span", { class: "largo" }, EJES[k]), el("span", { class: "corto" }, EJES[k].slice(0, 3) + ".")); return f; };
function mandos() {
  const ejes = () => Object.keys(EJES).map(k => [k, nombreEje(k)]);
  segmentos($("g-dim"), [[1, "1D"], [2, "2D"]], G.dim, v => grafico({ dim: v }));
  segmentos($("g-x"), ejes(), G.x, v => grafico({ x: v }));
  segmentos($("g-y"), ejes(), G.y, v => grafico({ y: v }));
  segmentos($("g-tam"), [[false, "Nada"], [true, EJES[tercero()]]], G.tam, v => grafico({ tam: v }));
  segmentos($("g-uno"), ejes(), G.uno, v => grafico({ uno: v }));
  for (const id of ["g-x-caja", "g-y-caja", "g-tam-caja"]) $(id).hidden = G.dim !== 2;
  $("g-uno-caja").hidden = G.dim !== 1;
}
// cerrado al cargar: solo se abre con "Editar gráfico"
$("g-editar").onclick = () => {
  const m = $("g-mandos"), abrir = m.hidden;
  m.hidden = !abrir;
  $("g-editar").textContent = abrir ? "Listo" : "Editar gráfico";
  $("g-editar").setAttribute("aria-expanded", String(abrir));
};

// hechas de un ámbito (de "## Done", la más reciente arriba): círculo relleno, tocarlo la devuelve a To Do
const abiertas = new Set();  // ámbitos con "Hechas" desplegado (al cargar, todas plegadas)
function hechas(a) {
  const hs = (D.hechas || []).filter(x => x.ambito === a);
  if (!hs.length) return null;
  const d = el("details", { class: "hechas" }); d.open = abiertas.has(a);
  d.ontoggle = () => d.open ? abiertas.add(a) : abiertas.delete(a);
  d.append(el("summary"));
  d.firstChild.append(el("span", { class: "etiqueta" }, "Hechas"), el("span", { class: "cuenta" }, String(hs.length)));
  const ul = el("ul", { class: "tareas hechas-lista" });
  for (const x of hs) {
    const li = el("li", { class: "fila" }), ok = el("button", { type: "button", class: "t-check marcada", "aria-label": `Volver a To Do: ${x.texto}`, title: "Volver a To Do" });
    ok.innerHTML = CHECK;
    ok.onclick = () => { ok.classList.remove("marcada"); ok.disabled = true; operar({ op: "reabrir", ambito: x.ambito, base: D.bases[x.ambito], id: x.id }, `Vuelve a To Do de ${x.ambito}`); };
    const f = el("div", { class: "t-fila" }), izq = el("div");
    izq.append(el("div", { class: "t-texto" }, x.texto));
    if (x.sub.length || x.notas.length) izq.append(el("div", { class: "t-extra" }, [x.sub.length ? (x.sub.length === 1 ? "1 subtarea" : `${x.sub.length} subtareas`) : "", x.notas.length ? "nota" : ""].filter(Boolean).join(", ")));
    f.append(izq, el("span", { class: "t-pts" }, x.fecha ? `${x.fecha.slice(8)}-${x.fecha.slice(5, 7)}` : ""));
    li.append(ok, f); ul.append(li);
  }
  d.append(ul);
  return d;
}

function porAmbito() {
  const xs = filtradas(true), c = $("lista"); c.replaceChildren();
  for (const a of D.ambitos.filter(a => !F.ambitos.length || F.ambitos.includes(a))) {
    const s = xs.filter(x => x.ambito === a), hs = hechas(a);
    if (!s.length && !hs && !F.ambitos.includes(a)) continue;
    const g = el("div", { class: "grupo-amb" }), h = el("header");
    h.append(el("h2", {}, a), el("span", { class: "cuenta" }, String(s.length)));
    const ul = el("ul", { class: "tareas" }); lista(ul, s, false); g.append(h, ul); if (hs) g.append(hs); c.append(g);
  }
  if (!c.children.length) c.append(el("div", { class: "vacio" }, "Nada con estos filtros"));
}

const vistaActual = () => location.hash === "#lista" ? "lista" : "matriz";
function pintar() {
  const v = vistaActual();
  $("v-matriz").hidden = v !== "matriz";
  $("v-lista").hidden = v !== "lista";
  $("f-prio-caja").hidden = v !== "lista";
  for (const a of document.querySelectorAll("#nav a")) a.classList.toggle("aqui", a.getAttribute("href") === "#" + v);
  multiple($("f-ambito"), D.ambitos.map(a => [a, a]), "ambitos");
  multiple($("f-estado"), Object.entries(EST), "estados");
  segmentos($("f-prio"), Object.entries(PRIO), F.prio, v => filtro("prio", v));
  mandos();
  leyenda();
  const sa = $("a-ambito"), previo = sa.value;
  sa.replaceChildren(...D.ambitos.map(a => el("option", { value: a }, a)));
  sa.value = (unAmbito() && F.ambitos[0]) || (D.ambitos.includes(previo) ? previo : D.ambitos[0]);
  v === "matriz" ? matriz() : porAmbito();
  $("pie").textContent = `${D.tareas.length} tareas de ${D.ambitos.length} ámbitos, leídas de 30 - Plan a las ${D.generado.slice(11)}` + (D.avisos.length ? `. Avisos: ${D.avisos.join(", ")}` : "");
  rellenar();
}

/* ---------- detalle ---------- */
function abrir(id) { sel = id; $("detalle").hidden = false; $("velo").hidden = false; pintar(); $("d-cerrar").focus({ preventScroll: true }); }
// cerrar (cruz, Esc o fuera) guarda lo que esté a medio escribir: el campo con foco al perder el foco
// y una subtarea escrita sin Enter
function cerrar() {
  const a = document.activeElement; if (a && a.closest("#detalle")) a.blur();
  const n = $("d-nuevo-sub"), x = tarea(sel), v = n.value.trim();
  if (x && v) editar(x, { sub: [...x.sub, v] });
  n.value = "";
  sel = null; $("detalle").hidden = true; $("velo").hidden = true; pintar();
}
const enFoco = e => document.activeElement === e;
function ajustarTitulo() { const t = $("d-titulo"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

function rellenar() {
  if (sel === null) return;
  const x = tarea(sel);
  if (!x) { cerrar(); return; }
  $("d-donde").textContent = `${x.ambito} · ${EST[x.estado]}`;
  if (!enFoco($("d-titulo"))) { $("d-titulo").value = x.crudo; ajustarTitulo(); }
  const pts = [["", "-"], ...[0, 1, 2, 3, 4, 5].map(n => [n, String(n)])];
  for (const k of Object.keys(EJES)) segmentos($("d-" + k), pts, x[k] ?? "", v => editar(x, { [k]: v === "" ? null : v }));
  const c = cuadrante(x);
  $("d-cuad").textContent = c ? `${c.t}. ${c.q}` : "-";
  segmentos($("d-estado"), Object.entries(EST), x.estado, v => v !== x.estado && editar(x, { estado: v }));
  segmentos($("d-ambito"), D.ambitos.map(a => [a, a]), x.ambito, v => v !== x.ambito && editar(x, { ambito_nuevo: v }));
  const subs = $("d-subs");
  if (!subs.contains(document.activeElement)) {
    subs.replaceChildren();
    x.sub.forEach((s, i) => {
      const li = el("li"), inp = el("input", { value: s, maxlength: "500", "aria-label": "Subtarea" }), q = el("button", { type: "button" }, "Quitar");
      inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
      inp.onchange = () => { const n = x.sub.slice(); n[i] = inp.value.trim(); editar(x, { sub: n.filter(Boolean) }); };
      q.onclick = () => editar(x, { sub: x.sub.filter((_, j) => j !== i) });
      li.append(inp, q); subs.append(li);
    });
  }
  if (!enFoco($("d-notas"))) $("d-notas").value = x.notas.join("\n");
  $("d-guardado").textContent = pendientes ? "Guardando" : "Guardado en la nota";
}

$("d-titulo").addEventListener("input", ajustarTitulo);
$("d-titulo").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
$("d-titulo").addEventListener("change", e => { const x = tarea(sel), v = e.target.value.trim(); if (x && v && v !== x.crudo) editar(x, { texto: v }); else if (x) e.target.value = x.crudo; });
$("d-notas").addEventListener("change", e => { const x = tarea(sel); if (x && e.target.value.trim() !== x.notas.join("\n").trim()) editar(x, { notas: e.target.value }); });
$("d-nuevo-sub").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const x = tarea(sel), v = e.target.value.trim();
  if (x && v) { editar(x, { sub: [...x.sub, v] }); e.target.value = ""; }
});
$("d-borrar").onclick = () => {
  const x = tarea(sel); if (!x) return;
  if (!confirm(`Eliminar "${x.texto}"? Se mueve a Eliminadas, al final de la nota de ${x.ambito}.`)) return;
  operar({ op: "borrar", ambito: x.ambito, base: D.bases[x.ambito], id: x.id }, "Eliminada");
};
// el círculo junto al título: la mueve a Done de su nota (como en To Do)
$("d-hecha").onclick = () => {
  const x = tarea(sel); if (!x) return;
  const a = document.activeElement; if (a && a.closest("#detalle")) a.blur();  // guarda antes lo que esté a medio escribir
  operar({ op: "completar", ambito: x.ambito, base: D.bases[x.ambito], id: x.id }, `Hecha. Movida a Done de ${x.ambito}`);
};
$("d-cerrar").onclick = cerrar;
$("velo").onclick = cerrar;
addEventListener("keydown", e => { if (e.key === "Escape" && sel !== null && !arrastre) cerrar(); });

/* ---------- guardar ---------- */
let cola = Promise.resolve();
function editar(x, cambios) {
  const id = x.id;
  // la base y el id se leen al salir de la cola: si un cambio anterior renombró la tarea, es la abierta (sel)
  return encolar(() => { const t = tarea(id) || tarea(sel); return t ? { op: "editar", ambito: t.ambito, base: D.bases[t.ambito], id: t.id, ...cambios } : null; });
}
// completar: la operación se arma al salir de la cola, con el id y la base que dejen los cambios anteriores
// (el recambio por la abierta, sel, solo si la operación era sobre la abierta: desde una lista podría ser otra)
function operar(cuerpo, ok) { const id = cuerpo.id, abierta = id === sel; return encolar(() => { if (!id) return cuerpo; const t = tarea(id) || (D.hechas || []).find(x => x.id === id) || (abierta ? tarea(sel) : null); return t ? { ...cuerpo, ambito: t.ambito, base: D.bases[t.ambito], id: t.id } : null; }, ok); }
function encolar(hacer, okTxt) {
  pendientes++; rellenar();
  cola = cola.then(async () => {
    const cuerpo = hacer();
    if (!cuerpo) return;
    try {
      const r = await fetch("/tareas/operar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
      const j = await r.json().catch(() => ({ ok: false, mensaje: "Respuesta rara del servidor. Recarga la página." }));
      if (j.datos) D = j.datos;
      if (j.ok) {
        if (cuerpo.op === "borrar" || cuerpo.op === "completar") { if (sel === cuerpo.id) { sel = null; $("detalle").hidden = true; $("velo").hidden = true; } }
        else if (sel !== null && cuerpo.op === "editar" && sel === cuerpo.id) sel = j.id;
        if (okTxt) aviso(okTxt);
      } else aviso(j.mensaje || "No se ha guardado.");
      if (r.status === 401) setTimeout(() => location.reload(), 1500);
    } catch (e) { aviso("No hay conexión con el portal. No se ha guardado."); }
  }).finally(() => { pendientes--; pintar(); });
  return cola;
}

/* ---------- añadir ---------- */
// importancia, urgencia y esfuerzo opcionales al crear; Enter crea igual sin tocarlos
for (const k of Object.keys(EJES)) {
  const s = $("a-" + k);
  s.replaceChildren(el("option", { value: "" }, `${CORTO[k]} -`), ...[0, 1, 2, 3, 4, 5].map(n => el("option", { value: String(n) }, `${CORTO[k]} ${n}`)));
  s.title = EJES[k];
  s.onchange = () => s.classList.toggle("puesto", s.value !== "");
}
$("anadir").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("a-texto"), texto = t.value.trim(), ambito = $("a-ambito").value, estado = $("a-estado").value;
  if (!texto) return;
  const pts = {};
  for (const k of Object.keys(EJES)) { const s = $("a-" + k); if (s.value !== "") pts[k] = +s.value; s.value = ""; s.classList.remove("puesto"); }
  t.value = "";
  encolar(() => ({ op: "crear", ambito, estado, texto, ...pts, base: D.bases[ambito] }), `Añadida a ${ambito}`);
  t.focus();
});

let avisoT;
function aviso(txt) { const t = $("toast"); t.textContent = txt; t.style.display = "block"; clearTimeout(avisoT); avisoT = setTimeout(() => t.style.display = "none", 3000); }

async function refrescar() {
  try {
    const r = await fetch("/tareas/datos", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (JSON.stringify(j.bases) !== JSON.stringify(D.bases) && !pendientes && !arrastre) { D = j; pintar(); }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !pendientes) refrescar(); });
setInterval(() => { if (!document.hidden && !pendientes && !arrastre && !(document.activeElement && document.activeElement.closest("#detalle, #anadir"))) refrescar(); }, 30000);

/* ---------- arrastrar en el gráfico ---------- */
// Siempre activo. Ratón: se arrastra a partir de 5 px; un clic sin mover abre la tarea.
// Dedo: pulsación larga (300 ms) para cogerla; si el dedo se mueve antes, es scroll de la página.
// Al soltar en otra casilla se guardan solo las puntuaciones de los ejes que se ven.
const plano = $("plano");
plano.addEventListener("pointerdown", e => {
  const b = e.target.closest(".punto-t");
  movido = false;
  if (!b || e.button > 0 || arrastre) return;
  const a = arrastre = { b, id: b.dataset.id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, listo: e.pointerType !== "touch", fantasma: null, destino: null, t: null };
  if (a.listo) { b.setPointerCapture(e.pointerId); return; }
  a.t = setTimeout(() => {
    if (arrastre !== a) return;
    a.listo = true; movido = true;  // tras la pulsación larga, soltar sin mover no abre la tarea
    b.classList.add("agarrado");
    try { navigator.vibrate?.(15); } catch (e) {}
    empezar(a, a.x0, a.y0);
  }, 300);
});
function empezar(a, x, y) {
  a.fantasma = a.b.cloneNode(true); a.fantasma.classList.add("fantasma"); a.fantasma.classList.remove("sel", "agarrado");
  document.body.append(a.fantasma);
  a.b.classList.add("arrastrando"); plano.classList.add("arrastre");
  mover(a, x, y);
  a.auto = setInterval(desplazar, 16);
}
// cerca del borde de arriba o de abajo la página se desplaza sola (en el móvil el gráfico no cabe entero)
function desplazar() {
  const a = arrastre; if (!a || !a.fantasma) return;
  const m = 60, y = a.y;
  const d = y < m ? -Math.ceil((m - y) / 3) : y > innerHeight - m ? Math.ceil((y - innerHeight + m) / 3) : 0;
  if (d) { scrollBy({ top: d, behavior: "instant" }); mover(a, a.x, a.y); }  // instant: estilo.css pone scroll suave
}
function mover(a, x, y) {
  a.x = x; a.y = y;
  a.fantasma.style.left = x + "px"; a.fantasma.style.top = y + "px";
  const c = document.elementFromPoint(x, y)?.closest(".celda");
  const d = c && plano.contains(c) ? c : null;
  if (d !== a.destino) { a.destino?.classList.remove("destino"); a.destino = d; d?.classList.add("destino"); }
}
plano.addEventListener("pointermove", e => {
  const a = arrastre; if (!a || e.pointerId !== a.pid) return;
  const lejos = Math.hypot(e.clientX - a.x0, e.clientY - a.y0);
  if (!a.listo) { if (lejos > 10) { clearTimeout(a.t); arrastre = null; } return; }  // el dedo se movió antes: scroll
  if (!a.fantasma) { if (lejos < 5) return; movido = true; empezar(a, e.clientX, e.clientY); }
  mover(a, e.clientX, e.clientY);
});
// con la tarea cogida, el dedo no desplaza la página
plano.addEventListener("touchmove", e => { if (arrastre && arrastre.listo) e.preventDefault(); }, { passive: false });
plano.addEventListener("contextmenu", e => { if (e.target.closest(".punto-t")) e.preventDefault(); });
function soltar(cancelar) {
  const a = arrastre; if (!a) return;
  arrastre = null; clearTimeout(a.t); clearInterval(a.auto);
  a.fantasma?.remove(); a.b.classList.remove("arrastrando", "agarrado"); a.destino?.classList.remove("destino"); plano.classList.remove("arrastre");
  const x = tarea(a.id);
  if (cancelar || !a.destino || !x) return;
  const cambios = {};
  for (const [k, v] of Object.entries(a.destino.pts)) if (x[k] !== v) cambios[k] = v;
  if (!Object.keys(cambios).length) return;
  Object.assign(x, cambios); pintar();  // se ve ya; si no se guarda, vuelve con los datos del servidor
  editar(x, cambios);
}
plano.addEventListener("pointerup", e => { if (arrastre && e.pointerId === arrastre.pid) soltar(false); });
plano.addEventListener("pointercancel", e => { if (arrastre && e.pointerId === arrastre.pid) soltar(true); });
addEventListener("keydown", e => { if (e.key === "Escape" && arrastre) soltar(true); });

addEventListener("hashchange", pintar);
pintar();
</script>
</body>
</html>
